<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple notes application demonstrating REST API requests.">
  <title>QuickNotes — API Practice</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>QuickNotes</h1>
      <p>A simple notes app powered by API requests.</p>
    </div>
  </header>

  <main class="container">
    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>

```
  <form id="note-form">
    <div class="form-group">
      <label for="title-input">Note title</label>
      <input
        type="text"
        id="title-input"
        name="title"
        maxlength="100"
        required
        placeholder="Enter a title"
      >
    </div>

    <div class="form-group">
      <label for="body-input">Note body (optional)</label>
      <textarea
        id="body-input"
        name="body"
        rows="4"
        placeholder="Write your note here"
      ></textarea>
    </div>

    <button type="submit" id="submit-btn">Create note</button>
  </form>
</section>

<section class="panel" aria-labelledby="notes-heading">
  <div class="section-heading">
    <h2 id="notes-heading">Your notes</h2>
    <button type="button" id="load-btn">Load notes</button>
  </div>

  <p id="status" class="status" role="status" aria-live="polite">
    Select "Load notes" to fetch notes from the server.
  </p>

  <ul id="notes-list" class="notes-list"></ul>
</section>

<footer class="page-footer">
  <p>QuickNotes Project 2 — Learning how web apps communicate with APIs.</p>
</footer>
```

  </main>
</body>
</html>
